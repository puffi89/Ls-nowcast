name: Prognose aktualisieren

on:
  schedule:
    - cron: "0 21 * * 1-5"     # werktags 22:00 MEZ / 23:00 MESZ
  workflow_dispatch:            # Knopf im Actions-Tab zum Sofortlauf

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas numpy openpyxl

      - name: Sheet ziehen und rechnen
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          python ls_ingest.py "$SHEET_URL"
          mv forecast.json public/forecast.json

      - name: Nur committen, wenn sich etwas geaendert hat
        run: |
          git config user.name  "prognose-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/forecast.json
          git diff --staged --quiet || git commit -m "Datenstand $(date +%F)"
          git push
